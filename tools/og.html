<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>OG image</title>
  <!--
    The social preview image (assets/img/og.png, 1200×630), drawn from config in the site's own preset.
    To make it: open this file, set the window to 1200×630 and take a screenshot, or run (Windows):
      msedge --headless --window-size=1200,630 --screenshot=assets\img\og.png tools\og.html
    <base> makes every path below relative to the site root, like the real pages.
  -->
  <base href="../">
  <link rel="stylesheet" href="css/base.css">
  <script src="config/site.js"></script>
  <script src="js/boot.js"></script>
  <style>
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body { display: grid; grid-template-rows: auto 1fr auto; padding: 56px 64px; }
    .og-top, .og-bottom { display: flex; justify-content: space-between; font-size: 22px; color: var(--ink-soft); }
    .og-line { align-self: center; max-width: 18ch; font-family: var(--font-display); font-size: 84px; line-height: 0.98; letter-spacing: -0.03em; }
    .og-line em { color: var(--accent-ink); }
    .og-name { font-family: var(--font-display); font-size: 30px; color: var(--ink); }
  </style>
</head>
<body>
  <div class="og-top"><span id="kicker"></span><span id="city"></span></div>
  <p class="og-line" id="line"></p>
  <div class="og-bottom"><span class="og-name" id="name"></span><span id="url"></span></div>
  <script>
    // Uses the first language in config, so the card matches the site's default.
    var site = window.SITE;
    var text = window.CONTENT[site.languages[0]];
    var fill = function (s) { return s.replace(/\{site\.([\w.]+)\}/g, function (m, k) { return k.split(".").reduce(function (o, x) { return o && o[x]; }, site) || ""; }); };
    var line = document.getElementById("line");
    fill(text.home.opening.line).split(/\*([^*]+)\*/).forEach(function (part, i) {
      line.append(i % 2 ? Object.assign(document.createElement("em"), { textContent: part }) : part);
    });
    document.getElementById("kicker").textContent = fill(text.home.opening.kicker);
    document.getElementById("city").textContent = fill(text.home.opening.since);
    document.getElementById("name").textContent = site.name;
    document.getElementById("url").textContent = String(site.url).replace(/^https?:\/\//, "").replace(/\[\[|\]\]/g, "");
  </script>
</body>
</html>
